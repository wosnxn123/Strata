name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Clippy
        if: hashFiles('Cargo.toml') != ''
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        if: hashFiles('Cargo.toml') != ''
        run: cargo test --workspace

  release:
    name: Release (${{ matrix.os }})
    needs: test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build release
        if: hashFiles('Cargo.toml') != ''
        run: cargo build --release --workspace

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: strata-cli-${{ matrix.os }}
          path: target/release/strata-cli*
          if-no-files-found: ignore


  java-bridge:
    name: Java Bridge
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build native library
        run: cargo build --release -p strata-ffi

      - name: Stage native library into bridge resources
        run: cp target/release/libstrata_ffi.so java-bridge/src/main/resources/natives/strata_ffi.so

      - name: Build bridge jar
        working-directory: java-bridge
        run: gradle jar

      - name: Upload bridge jar
        uses: actions/upload-artifact@v4
        with:
          name: java-bridge
          path: java-bridge/build/libs/java-bridge.jar