[package]
name = "strata-cli"
version = "0.2.0"
edition = "2021"

[dependencies]
strata-core = { path = "../strata-core" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
zstd = { workspace = true }
flate2 = "1"
lz4_flex = "0.11"

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "vs_anvil"
harness = false
