[package]
name = "strata-ffi"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
strata-core = { path = "../strata-core" }

[dev-dependencies]
tempfile = "3"

[features]
# JNI 导出符号层（Java_dev_strata_bridge_StrataNative_*）；默认关闭，
# 需要 DLL/SO 供 JVM 加载时以 `cargo build -p strata-ffi --features jni` 启用。
jni = []
